; cava config for the bar's media widget (MediaWidget.qml reads the first half of the bars)
[general]
framerate = 30
bars = 12
autosens = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average
