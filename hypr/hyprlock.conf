# Generated by scripts/lock.sh: $wallpaper, $primary, $fg, $error, $weather
source = ~/.cache/hyprlock/vars.conf

general {
    hide_cursor = true
}

animations {
    enabled = false
}

# hyprlock can't blur behind a single widget, so the wallpaper itself is blurred
# and the translucent input field shows it through as frosted glass
background {
    path = $wallpaper
    blur_passes = 3
    blur_size = 6
    brightness = 0.65
    vibrancy = 0.2
}

# weather + location
label {
    text = $weather
    color = $fg
    font_size = 13
    font_family = Mononoki
    position = 0, -24
    halign = center
    valign = top
}

# hours
label {
    text = cmd[update:1000] date +%H
    color = $fg
    font_size = 330
    font_family = Mononoki
    position = 0, 560
    halign = center
    valign = center
}

# minutes
label {
    text = cmd[update:1000] date +%M
    color = $fg
    font_size = 330
    font_weight = 900
    font_family = Mononoki
    position = 0, 170
    halign = center
    valign = center
}

# date
label {
    text = cmd[update:60000] LC_TIME=nl_BE.UTF-8 date +'%a %-d %b %Y'
    color = $fg
    font_size = 29
    font_family = Mononoki
    position = 0, -40
    halign = center
    valign = center
}

# username, aligned with the input field's left edge
# shortcut: x assumes a 3840px-wide monitor ((3840-460)/2), recompute if the monitor changes
label {
    text = $USER · Enter password
    color = $fg
    font_size = 20
    font_family = Mononoki
    position = 1690, -700
    halign = left
    valign = center
}

input-field {
    size = 460, 70
    rounding = 4
    outline_thickness = 3
    outer_color = rgba(250, 253, 255, 0.2)
    inner_color = rgba(10, 10, 12, 0.35)
    font_color = $fg
    font_family = Mononoki
    placeholder_text = <span></span>                
    fail_text = <span alpha="85%">$FAIL ($ATTEMPTS)</span>
    check_color = $primary
    fail_color = $error
    capslock_color = $error
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = false
    fade_on_empty = false
    position = 0, -760
    halign = center
    valign = center
}
